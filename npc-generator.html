<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de NPC</title>
  <link rel="stylesheet" href="npc-generator.css">
</head>
<body>
  <div class="layout">
    <aside class="floating-menu">
      <h2 class="menu-title">Gerador de NPC</h2>
      <div class="menu-group"><label for="nomeInput">Nome</label><input id="nomeInput" type="text" placeholder="Ex.: Arven, Lyra..." /></div>
      <div class="menu-group"><label for="profissaoSelect">Profissão</label><select id="profissaoSelect"></select></div>
      <div class="menu-group"><label for="cidadeSelect">Cidade Natal (Cidade/Vila)</label><select id="cidadeSelect"></select></div>
      <div class="menu-group"><label for="generoSelect">Perfil Visual</label><select id="generoSelect"><option value="homens">Homens</option><option value="mulheres">Mulheres</option><option value="androgenos">Andrógenos</option></select></div>
      <div class="menu-group"><label for="antepassadoSelect">Antepassado</label><select id="antepassadoSelect"></select></div>
      <div class="menu-group"><label>Classes (múltipla escolha)</label><div id="classeChecks" class="check-list"></div></div>
      <div class="menu-group"><label for="idadeInput">Idade (auto pela raça)</label><input id="idadeInput" type="number" min="1" /></div>
      <div class="menu-group"><label>Temperamentos (múltipla escolha)</label><div id="temperamentoChecks" class="check-list"></div></div>
      <div class="menu-group"><label>Lealdades (múltipla escolha)</label><div id="lealdadeChecks" class="check-list"></div></div>
      <button id="applyButton" type="button">Aplicar seleções</button>
      <div style="height: 8px;"></div>
      <button id="randomizeButton" type="button">Gerar aleatório</button>
    </aside>

    <aside class="floating-menu floating-menu-right">
      <h2 class="menu-title">Filtro de Origem</h2>
      <div class="menu-group"><label for="rangeCenterSelect">Cidade/Vila de referência</label><select id="rangeCenterSelect"></select></div>
      <div class="menu-group"><label for="distanceRange">Raio de origem (<span id="distanceValue">100</span>%)</label><input id="distanceRange" type="range" min="1" max="100" value="100"></div>
      <p class="range-help">100% = mundo inteiro (8000x5000). Valores menores restringem a origem a localidades adjacentes.</p>
    </aside>

    <main class="content">
      <section class="card">
        <h1>Ficha do NPC</h1>
        <ul class="npc-list">
          <li><button class="reroll-field" data-field="nome">🎲</button> <strong>Nome:</strong> <span id="nomeValue"></span></li>
          <li><button class="reroll-field" data-field="profissao">🎲</button> <strong>Profissão:</strong> <span id="profissaoValue"></span></li>
          <li><button class="reroll-field" data-field="cidadeNatal">🎲</button> <strong>Local:</strong> <a id="cidadeNatalLink" href="mapa.html" target="_blank" rel="noopener"><span id="cidadeNatalValue"></span></a></li>
          <li><button class="reroll-field" data-field="antepassado">🎲</button> <strong>Antepassado:</strong> <span id="antepassadoValue"></span></li>
          <li><button class="reroll-field" data-field="classe">🎲</button> <strong>Classe:</strong> <span id="classeValue"></span></li>
          <li><button class="reroll-field" data-field="idade">🎲</button> <strong>Idade:</strong> <span id="idadeValue"></span></li>
          <li><strong>Características:</strong><ul id="caracteristicasValue" class="npc-char-list"></ul></li>
          <li><button class="reroll-field" data-field="temperamento">🎲</button> <strong>Temperamento:</strong> <span id="temperamentoValue"></span></li>
          <li><button class="reroll-field" data-field="lealdade">🎲</button> <strong>Lealdade:</strong> <span id="lealdadeValue"></span></li>
        </ul>
      </section>
    </main>
  </div>
  <script src="npc-generator.js"></script>
</body>
</html>
