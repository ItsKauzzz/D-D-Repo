<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercado Medieval • RPG Tool Test</title>
  <link rel="stylesheet" href="shop.css">
</head>
<body>
  <div class="page-shell">
    <header class="hero panel">
      <a class="back-link" href="./index.html">← Voltar ao salão</a>
      <p class="eyebrow">⚜ Catálogo do mercador ⚜</p>
      <h1>Mercado Medieval de Itens Compráveis</h1>
      <p class="hero-text">Armas, armaduras, poções, montarias, moradia, ferramentas e curiosidades para abastecer qualquer campanha de D&amp;D.</p>
      <div class="toolbar" role="search">
        <label for="item-search">Buscar no mercado</label>
        <input id="item-search" type="search" placeholder="Ex.: poção, espada, tenda, casa...">
      </div>
    </header>

    <main>
      <aside class="category-panel panel" aria-label="Categorias do mercado">
        <h2>Corredores</h2>
        <div id="category-list" class="category-list"></div>
      </aside>

      <section class="catalog panel" aria-live="polite">
        <div class="catalog-heading">
          <div>
            <p class="eyebrow">Inventário disponível</p>
            <h2 id="catalog-title">Todos os itens</h2>
          </div>
          <span id="item-count" class="item-count">0 itens</span>
        </div>
        <div id="catalog-grid" class="catalog-grid"></div>
      </section>
    </main>
  </div>

  <script src="shop.js"></script>
</body>
</html>
